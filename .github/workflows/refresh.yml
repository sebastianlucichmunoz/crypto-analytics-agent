name: Crypto Analytics - Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Extractor and Batch Agent
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.data.extractor
          python -m src.agents.batch_agent