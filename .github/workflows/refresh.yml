name: Crypto Analytics - Refresh

on:
  workflow_dispatch:
    inputs:
      daily:
        description: "Historico + reentrenamiento"
        required: false
        default: "false"
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
      MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      TOP_N: "20"
      HISTORY_DAYS: "365"
      MODEL_MIN_ROWS: "180"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: python -m pip install -r requirements.txt

      # FASE A: Ingesta de datos y modelos (Se ejecuta en los cron de las 00:00 y 12:00, o de forma manual)
      - name: Actualizar datos de mercado y predicciones
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 12 * * *'))
        run: |
          if [ "${{ inputs.daily }}" == "true" ]; then
            python scripts/refresh.py --daily
          else
            python scripts/refresh.py
          fi

      # FASE B: Agente Batch del Dashboard y su respectivo commit
      - name: Run Gemini Batch Agent
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 12 * * *'))
        run: python -m src.agents.batch_agent

      - name: Commit and push updated JSON
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 12 * * *'))
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/daily_recommendations.json
          git commit -m "auto: update daily recommendations via Gemini [skip ci]" || exit 0
          git push

      # FASE C: Agente de Notificaciones y Envío de Correo (Se ejecuta únicamente a las 13:00 UTC)
      - name: Run Notification & Email Pipeline (Daily Alert)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *')
        run: python -m src.agents.run_pipeline


