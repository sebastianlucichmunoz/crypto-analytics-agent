name: Crypto Analytics - Refresh

on:
  workflow_dispatch:
    inputs:
      daily:
        description: "Historico + reentrenamiento"
        required: false
        default: "false"

  schedule:
    - cron: "0 12 * * *"    # 07:00 AM Lima (12:00 UTC)
    - cron: "0 21 * * *"    # 04:00 PM Lima (21:00 UTC)
    - cron: "30 23 * * *"   # 06:30 PM Lima (23:30 UTC)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: python -m pip install -r requirements.txt

      - name: Run Gemini Batch Agent
        run: python -m src.agents.batch_agent
        
      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/daily_recommendations.json
          git commit -m "auto: update daily recommendations via Gemini [skip ci]" || exit 0
          git push